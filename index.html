<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hunting Ground</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none;
    -webkit-user-select:none; user-select:none; font-family:'Segoe UI', Arial, sans-serif;
    position:fixed; }
  #game-canvas { position:fixed; inset:0; display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; display:none; z-index:5; }
  .hud-top { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:0; right:0;
    display:flex; justify-content:center; gap:14px; align-items:center; }
  .hud-chip { background:rgba(0,0,0,.45); color:#fff; padding:6px 14px; border-radius:20px;
    font-size:15px; font-weight:700; letter-spacing:1px; border:1px solid rgba(255,255,255,.25); }
  #wave-chip { color:#ffd54a; }
  #kills-chip { color:#7CFC98; }

  /* health bar */
  #health-wrap { position:absolute; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%); width:min(46vw,320px); height:18px; background:rgba(0,0,0,.5);
    border:2px solid rgba(255,255,255,.6); border-radius:10px; overflow:hidden; }
  #health-bar { height:100%; width:100%; background:linear-gradient(90deg,#4caf50,#8bc34a);
    transition:width .2s; }
  #health-num { position:absolute; inset:0; text-align:center; color:#fff; font-size:12px;
    font-weight:800; line-height:16px; text-shadow:0 1px 2px #000; }

  /* crosshair */
  #crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:26px; height:26px; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:#fff;
    box-shadow:0 0 3px #000; }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }
  #crosshair .dot { position:absolute; left:50%; top:50%; width:4px; height:4px;
    background:#ff3b30; border-radius:50%; transform:translate(-50%,-50%); }
  #hitmarker { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg);
    width:34px; height:34px; opacity:0; }
  #hitmarker::before, #hitmarker::after { content:''; position:absolute; background:#ffd54a; }
  #hitmarker::before { left:50%; top:0; width:3px; height:100%; transform:translateX(-50%); }
  #hitmarker::after { top:50%; left:0; height:3px; width:100%; transform:translateY(-50%); }
  #hitmarker.show { animation:hitpop .18s ease-out; }
  @keyframes hitpop { 0%{opacity:1; transform:translate(-50%,-50%) rotate(45deg) scale(1.4);}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(45deg) scale(.8);} }

  /* damage vignette */
  #dmg-vignette { position:fixed; inset:0; pointer-events:none; z-index:6; opacity:0;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(255,0,0,.55) 100%); }

  /* ---------- touch controls ---------- */
  .stick-zone { position:absolute; bottom:calc(50px + env(safe-area-inset-bottom)); left:22px;
    width:130px; height:130px; pointer-events:auto; }
  #stick-base { position:absolute; inset:0; border-radius:50%; background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.35); }
  #stick-nub { position:absolute; left:50%; top:50%; width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,.45); border:2px solid rgba(255,255,255,.7);
    transform:translate(-50%,-50%); }
  .btn-round { position:absolute; pointer-events:auto; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff;
    text-shadow:0 1px 3px #000; border:2px solid rgba(255,255,255,.55); }
  #btn-shoot { right:26px; bottom:calc(56px + env(safe-area-inset-bottom)); width:96px; height:96px;
    background:rgba(255,59,48,.55); font-size:18px; }
  #btn-shoot:active { background:rgba(255,59,48,.85); }

  /* ---------- banners / screens ---------- */
  #wave-banner { position:fixed; top:32%; left:0; right:0; text-align:center; z-index:7;
    pointer-events:none; opacity:0; }
  #wave-banner .big { font-size:clamp(30px,8vw,56px); font-weight:900; color:#ffd54a;
    text-shadow:0 3px 12px #000; letter-spacing:3px; }
  #wave-banner.show { animation:banner 2.2s ease-out; }
  @keyframes banner { 0%{opacity:0; transform:scale(.7);} 15%{opacity:1; transform:scale(1);}
    75%{opacity:1;} 100%{opacity:0;} }

  .screen { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#fff; padding:24px;
    background:radial-gradient(ellipse at 50% 30%, #2e4a2b 0%, #101c10 70%, #060a06 100%); }
  .screen h1 { font-size:clamp(34px,9vw,64px); font-weight:900; letter-spacing:4px;
    color:#ffd54a; text-shadow:0 4px 18px rgba(0,0,0,.9); margin-bottom:8px; }
  .screen .sub { font-size:clamp(14px,4vw,19px); color:#cfe8cf; margin-bottom:26px;
    max-width:520px; line-height:1.5; }
  .big-btn { pointer-events:auto; background:linear-gradient(180deg,#ff7043,#e64a19);
    border:3px solid #ffcc80; color:#fff; font-size:clamp(18px,5vw,24px); font-weight:900;
    letter-spacing:2px; padding:16px 44px; border-radius:50px; cursor:pointer;
    box-shadow:0 6px 24px rgba(230,74,25,.5); }
  .big-btn:active { transform:scale(.95); }
  .controls-hint { margin-top:26px; font-size:13px; color:#9fbf9f; line-height:1.8; }
  #gameover-screen { display:none; }
  #final-score { font-size:clamp(22px,6vw,34px); color:#7CFC98; font-weight:800; margin-bottom:24px; }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-top">
    <div class="hud-chip" id="wave-chip">WAVE 1</div>
    <div class="hud-chip" id="kills-chip">KILLS 0</div>
  </div>
  <div id="crosshair"><div class="dot"></div></div>
  <div id="hitmarker"></div>
  <div id="health-wrap"><div id="health-bar"></div><div id="health-num">100</div></div>
  <div id="boss-wrap" style="display:none; position:absolute; top:calc(48px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(62vw,380px);">
    <div style="text-align:center; color:#ff5252; font-size:13px; font-weight:900; letter-spacing:3px; text-shadow:0 1px 3px #000; margin-bottom:3px;">&#128520; BOSS</div>
    <div style="height:14px; background:rgba(0,0,0,.55); border:2px solid #ff5252; border-radius:8px; overflow:hidden;">
      <div id="boss-bar" style="height:100%; width:100%; background:linear-gradient(90deg,#b71c1c,#ff5252); transition:width .15s;"></div>
    </div>
  </div>
  <div class="stick-zone" id="stick-zone">
    <div id="stick-base"></div><div id="stick-nub"></div>
  </div>
  <div class="btn-round" id="btn-shoot">FIRE</div>
</div>

<div id="dmg-vignette"></div>

<div id="wave-banner"><div class="big" id="wave-banner-text">WAVE 1</div></div>

<div class="screen" id="start-screen">
  <h1>HUNTING GROUND</h1>
  <div class="sub">Drop in. Survive the waves.<br>Hunt them before they hunt you. &#127907;</div>
  <button class="big-btn" id="btn-start">&#9654; START</button>
  <div style="position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));right:14px;font-size:12px;color:#7da07d;">v1.3</div>
  <div class="controls-hint">
    &#128241; Left stick: move &nbsp;|&nbsp; Drag right side: aim &nbsp;|&nbsp; FIRE: shoot<br>
    &#128187; WASD: move &nbsp;|&nbsp; Mouse: aim &nbsp;|&nbsp; Click: shoot
  </div>
</div>

<div class="screen" id="gameover-screen">
  <h1>YOU GOT HUNTED</h1>
  <div id="final-score">Kills: 0 &nbsp;&bull;&nbsp; Wave 1</div>
  <button class="big-btn" id="btn-restart">&#8635; HUNT AGAIN</button>
</div>

<canvas id="game-canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ============================================================ setup
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5e0);
scene.fog = new THREE.Fog(0x87b5e0, 55, 160);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 400);

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x4a6a3a, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d0, 0.85);
sun.position.set(40, 70, 25);
scene.add(sun);

// ============================================================ world
const WORLD_R = 95;          // playable radius
const groundGeo = new THREE.CircleGeometry(WORLD_R+40, 48);
const groundMat = new THREE.MeshLambertMaterial({color:0x5d8a45});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// grass patches for texture
const patchGeo = new THREE.CircleGeometry(3, 7);
const patchMats = [0x527d3c, 0x679651, 0x4c7039].map(c=>new THREE.MeshLambertMaterial({color:c}));
for (let i=0;i<90;i++){
  const p = new THREE.Mesh(patchGeo, patchMats[i%3]);
  const r = Math.sqrt(Math.random())*(WORLD_R+25), a = Math.random()*Math.PI*2;
  p.position.set(Math.cos(a)*r, 0.02, Math.sin(a)*r);
  p.rotation.x = -Math.PI/2;
  p.scale.setScalar(0.6+Math.random()*1.8);
  scene.add(p);
}

// trees + rocks (also act as simple obstacles visually)
const obstacles = [];
const trunkMat = new THREE.MeshLambertMaterial({color:0x6b4a2a});
const leafMats = [0x2f6b2f,0x3a7a34,0x2a5f33].map(c=>new THREE.MeshLambertMaterial({color:c}));
const rockMat = new THREE.MeshLambertMaterial({color:0x8d8d8d});
function randRing(minR, maxR){
  const r = minR + Math.random()*(maxR-minR), a = Math.random()*Math.PI*2;
  return {x:Math.cos(a)*r, z:Math.sin(a)*r};
}
for (let i=0;i<70;i++){
  const pos = randRing(10, WORLD_R+15);
  const t = new THREE.Group();
  const h = 3+Math.random()*3;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.32,h*0.4,6), trunkMat);
  trunk.position.y = h*0.2;
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.4+Math.random(), h, 7), leafMats[i%3]);
  leaves.position.y = h*0.4 + h*0.5;
  t.add(trunk); t.add(leaves);
  t.position.set(pos.x, 0, pos.z);
  t.scale.setScalar(0.8+Math.random()*0.9);
  scene.add(t);
  obstacles.push({x:pos.x, z:pos.z, r:1.1});
}
for (let i=0;i<26;i++){
  const pos = randRing(8, WORLD_R+10);
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7+Math.random()*1.3, 0), rockMat);
  rock.position.set(pos.x, 0.5, pos.z);
  rock.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
  scene.add(rock);
  obstacles.push({x:pos.x, z:pos.z, r:1.3});
}
// a few supply crates for PUBG flavor
const crateMat = new THREE.MeshLambertMaterial({color:0xa8763e});
const crateEdge = new THREE.MeshLambertMaterial({color:0x7a5327});
for (let i=0;i<10;i++){
  const pos = randRing(6, WORLD_R-5);
  const c = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,1.6), crateMat);
  box.position.y = 0.8;
  const lid = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.25,1.7), crateEdge);
  lid.position.y = 1.7;
  c.add(box); c.add(lid);
  c.position.set(pos.x, 0, pos.z);
  c.rotation.y = Math.random()*Math.PI;
  scene.add(c);
  obstacles.push({x:pos.x, z:pos.z, r:1.4});
}

// distant mountains ring
const mtnMat = new THREE.MeshLambertMaterial({color:0x6e86a0, fog:false});
for (let i=0;i<14;i++){
  const a = (i/14)*Math.PI*2 + Math.random()*0.2;
  const r = 210+Math.random()*60;
  const h = 40+Math.random()*45;
  const m = new THREE.Mesh(new THREE.ConeGeometry(h*0.9, h, 5), mtnMat);
  m.position.set(Math.cos(a)*r, h/2-4, Math.sin(a)*r);
  scene.add(m);
}

// ============================================================ gun view model
const gun = new THREE.Group();
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.14,0.5), new THREE.MeshLambertMaterial({color:0x22262b}));
const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.3,8), new THREE.MeshLambertMaterial({color:0x111417}));
gunBarrel.rotation.x = Math.PI/2; gunBarrel.position.set(0,0.03,-0.38);
const gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.18,0.09), new THREE.MeshLambertMaterial({color:0x3a2f22}));
gunGrip.position.set(0,-0.13,0.12); gunGrip.rotation.x = 0.3;
gun.add(gunBody); gun.add(gunBarrel); gun.add(gunGrip);
gun.position.set(0.24,-0.22,-0.55);
camera.add(gun);
scene.add(camera);

// muzzle flash
const flash = new THREE.PointLight(0xffc04d, 0, 6);
flash.position.set(0.24,-0.15,-1.1);
camera.add(flash);

// ============================================================ enemies
const enemies = [];
const enemyMats = {
  body: new THREE.MeshLambertMaterial({color:0x8a2f2f}),
  head: new THREE.MeshLambertMaterial({color:0xd9b08c}),
  legs: new THREE.MeshLambertMaterial({color:0x333a44})
};
function makeEnemy(x, z){
  const g = new THREE.Group();
  const legs = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.8,0.35), enemyMats.legs);
  legs.position.y = 0.4;
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.85,0.4), enemyMats.body.clone());
  body.position.y = 1.22;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.38,0.38), enemyMats.head.clone());
  head.position.y = 1.85;
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.7,0.18), enemyMats.body.clone());
  armL.position.set(-0.48,1.2,0);
  const armR = armL.clone(); armR.position.x = 0.48;
  g.add(legs); g.add(body); g.add(head); g.add(armL); g.add(armR);
  g.position.set(x, 0, z);
  scene.add(g);
  const e = {
    mesh:g, bodyMat:body.material, headMat:head.material,
    hp:3, speed:2.1+Math.random()*0.9+wave*0.08,
    range:2.0, damage:8,
    attackCd:0, flashT:0, dead:false, deadT:0, bob:Math.random()*10
  };
  body.userData.enemy = e; head.userData.enemy = e;
  legs.userData.enemy = e; armL.userData.enemy = e; armR.userData.enemy = e;
  enemies.push(e);
  return e;
}
function killEnemy(e){
  e.dead = true; e.deadT = 0;
  if (e.isBoss){
    kills += 5;
    hp = 100;
    document.getElementById('boss-wrap').style.display='none';
    showBanner('BOSS DOWN! +5 KILLS');
  } else {
    kills++;
  }
  updateHUD();
  sfxDead();
}

// ============================================================ boss monster (Smiley's design)
function createBossMonster(){
  const boss = new THREE.Group();

  const rockSkinMat = new THREE.MeshStandardMaterial({color:0x232529, roughness:0.9, metalness:0.15, flatShading:true});
  const rockLightMat = new THREE.MeshStandardMaterial({color:0x3a3d42, roughness:0.85, metalness:0.15, flatShading:true});
  const boneSpikeMat = new THREE.MeshStandardMaterial({color:0xd8dadf, roughness:0.5, metalness:0.1, flatShading:true});
  const tornClothMat = new THREE.MeshStandardMaterial({color:0x1d3b2a, roughness:0.9, flatShading:true});
  const eyeGlowMat = new THREE.MeshStandardMaterial({color:0xff1a1a, emissive:0xff0000, emissiveIntensity:3.0});
  const mouthMat = new THREE.MeshStandardMaterial({color:0x0a0505, roughness:1.0});

  // shared low-poly geometries - reused by every chunk, cheap on the phone
  const chunkA = new THREE.DodecahedronGeometry(0.22, 0);
  const chunkB = new THREE.TetrahedronGeometry(0.26, 0);
  const spikeS = new THREE.ConeGeometry(0.12, 0.5, 5);
  const spikeM = new THREE.ConeGeometry(0.16, 0.85, 5);
  const spikeL = new THREE.ConeGeometry(0.2, 1.15, 5);
  const toothGeo = new THREE.ConeGeometry(0.06, 0.2, 4);

  // deterministic pseudo-random so the boss always looks the same
  let seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  function shard(geo, mat, x, y, z, s, rx, ry, rz){
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.scale.setScalar(s);
    m.rotation.set(rx || 0, ry || 0, rz || 0);
    return m;
  }
  // scatter small rock chunks over an ellipsoid area -> craggy broken-rock skin
  function crumble(parent, cx, cy, cz, rx, ry, rz, count){
    for (let i = 0; i < count; i++){
      const a = rnd() * Math.PI * 2, b = (rnd() - 0.5) * Math.PI;
      const m = new THREE.Mesh(rnd() > 0.5 ? chunkA : chunkB, rnd() > 0.6 ? rockLightMat : rockSkinMat);
      m.position.set(cx + Math.cos(a)*Math.cos(b)*rx, cy + Math.sin(b)*ry, cz + Math.sin(a)*Math.cos(b)*rz);
      m.scale.setScalar(0.5 + rnd() * 1.1);
      m.rotation.set(rnd()*3, rnd()*3, rnd()*3);
      parent.add(m);
    }
  }

  // ---- pelvis & torn green pants
  const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.85, 0.9, 8), tornClothMat);
  pelvis.position.y = 1.65;
  boss.add(pelvis);
  // torn cloth strips hanging from the waist
  for (let i = 0; i < 9; i++){
    const a = (i / 9) * Math.PI * 2;
    const strip = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.55 + (i%3)*0.15, 4), tornClothMat);
    strip.position.set(Math.cos(a)*0.8, 1.15, Math.sin(a)*0.8);
    strip.rotation.x = Math.PI;
    strip.rotation.z = (rnd()-0.5)*0.5;
    boss.add(strip);
  }

  // ---- hulking torso
  const chestGeo = new THREE.DodecahedronGeometry(1.35, 1);
  chestGeo.scale(1.25, 1.15, 0.85);
  const chest = new THREE.Mesh(chestGeo, rockSkinMat);
  chest.position.y = 2.6;
  boss.add(chest);
  // pectoral plates
  for (const s of [-1, 1]){
    const pec = new THREE.Mesh(new THREE.DodecahedronGeometry(0.55, 0), rockLightMat);
    pec.scale.set(1.1, 0.85, 0.55);
    pec.position.set(s*0.58, 2.95, 0.72);
    boss.add(pec);
  }
  // segmented rock abs
  for (let r = 0; r < 3; r++){
    for (const s of [-1, 1]){
      const ab = new THREE.Mesh(new THREE.DodecahedronGeometry(0.24, 0), rockLightMat);
      ab.scale.set(1.0, 0.8, 0.55);
      ab.position.set(s*0.28, 2.35 - r*0.32, 0.78);
      boss.add(ab);
    }
  }
  // craggy skin chunks over the torso
  crumble(boss, 0, 2.7, 0.1, 1.45, 1.0, 0.8, 26);

  // ---- skull-like jagged head
  const headGroup = new THREE.Group();
  headGroup.position.set(0, 3.62, 0.28);
  headGroup.scale.setScalar(1.22);
  const skullGeo = new THREE.DodecahedronGeometry(0.56, 1);
  skullGeo.scale(0.95, 1.1, 0.95);
  headGroup.add(new THREE.Mesh(skullGeo, rockSkinMat));
  // heavy jagged brow ridge
  const brow = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.18, 0.3), rockLightMat);
  brow.position.set(0, 0.22, 0.42);
  brow.rotation.x = -0.15;
  headGroup.add(brow);
  // brow spikes
  for (const s of [-1, 1]){
    headGroup.add(shard(spikeS, boneSpikeMat, s*0.3, 0.38, 0.35, 1, 0.5, 0, s*-0.4));
  }
  // deep-set glowing eyes
  const eyeGeo = new THREE.SphereGeometry(0.09, 8, 8);
  for (const s of [-1, 1]){
    const eye = new THREE.Mesh(eyeGeo, eyeGlowMat);
    eye.position.set(s*0.19, 0.06, 0.47);
    headGroup.add(eye);
  }
  // nose hole
  headGroup.add(shard(toothGeo, mouthMat, 0, -0.08, 0.52, 1.2, Math.PI, 0, 0));
  // open mouth (dark cavity)
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.25), mouthMat);
  mouth.position.set(0, -0.28, 0.42);
  headGroup.add(mouth);
  // jagged teeth - upper row points down, lower row points up
  for (let i = 0; i < 6; i++){
    headGroup.add(shard(toothGeo, boneSpikeMat, -0.2 + i*0.08, -0.17, 0.52, 1, Math.PI, 0, 0));
  }
  const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.12, 0.28), rockSkinMat);
  jaw.position.set(0, -0.42, 0.38);
  jaw.rotation.x = 0.25;
  headGroup.add(jaw);
  for (let i = 0; i < 5; i++){
    headGroup.add(shard(toothGeo, boneSpikeMat, -0.16 + i*0.08, -0.35, 0.46, 0.9, 0, 0, 0));
  }
  // cheek spikes
  for (const s of [-1, 1]){
    headGroup.add(shard(spikeS, boneSpikeMat, s*0.5, -0.15, 0.15, 1.1, 0.2, 0, s*-1.2));
  }
  // crown spikes on the skull
  for (let i = 0; i < 4; i++){
    headGroup.add(shard(spikeS, boneSpikeMat, -0.24 + i*0.16, 0.55, -0.05, 1, -0.3, 0, 0));
  }
  boss.add(headGroup);

  // ---- big spiky shoulders + heavy arms with claws
  function createArm(side){
    const armGroup = new THREE.Group();
    armGroup.position.set(side * 1.6, 3.15, 0);
    // boulder shoulder
    const shoulder = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8, 1), rockSkinMat);
    armGroup.add(shoulder);
    crumble(armGroup, 0, 0.1, 0, 0.7, 0.6, 0.6, 8);
    // BIG shoulder spikes (up & outward)
    armGroup.add(shard(spikeL, boneSpikeMat, side*0.25, 0.75, 0, 1.15, 0, 0, side*-0.5));
    armGroup.add(shard(spikeM, boneSpikeMat, side*0.6, 0.5, 0.15, 1.1, 0, 0, side*-0.9));
    armGroup.add(shard(spikeM, boneSpikeMat, side*0.1, 0.8, -0.25, 0.9, 0.3, 0, side*-0.2));
    // upper arm
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 1.0, 7), rockSkinMat);
    upper.position.set(side*0.35, -0.8, 0.05);
    upper.rotation.z = side*0.25;
    armGroup.add(upper);
    // thick forearm
    const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.62, 1.3, 7), rockSkinMat);
    forearm.position.set(side*0.6, -1.7, 0.15);
    armGroup.add(forearm);
    crumble(armGroup, side*0.6, -1.7, 0.15, 0.5, 0.6, 0.5, 6);
    // forearm spike row
    for (let i = 0; i < 3; i++){
      armGroup.add(shard(spikeM, boneSpikeMat, side*(0.85 + (i%2)*0.1), -1.3 - i*0.35, 0.2, 1, 0, 0, side*-1.1));
    }
    // claw hand
    const fist = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5, 0), rockSkinMat);
    fist.position.set(side*0.65, -2.5, 0.2);
    armGroup.add(fist);
    for (let i = 0; i < 4; i++){
      const claw = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.45, 4), boneSpikeMat);
      claw.position.set(side*(0.42 + i*0.15), -2.85, 0.25);
      claw.rotation.x = Math.PI;
      armGroup.add(claw);
    }
    return armGroup;
  }
  boss.add(createArm(-1), createArm(1));

  // ---- legs with rocky shins + knee spikes
  function createLeg(side){
    const legGroup = new THREE.Group();
    legGroup.position.set(side * 0.62, 1.25, 0);
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.42, 1.1, 7), tornClothMat);
    thigh.position.y = -0.35;
    legGroup.add(thigh);
    const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, 1.1, 7), rockSkinMat);
    shin.position.y = -1.25;
    legGroup.add(shin);
    crumble(legGroup, 0, -1.25, 0, 0.42, 0.55, 0.42, 5);
    // knee spike
    legGroup.add(shard(spikeS, boneSpikeMat, 0, -0.75, 0.4, 1.1, 1.2, 0, 0));
    // ankle shard
    legGroup.add(shard(chunkB, rockLightMat, side*0.2, -1.8, 0.2, 0.9, 0, 1, 0.4));
    return legGroup;
  }
  boss.add(createLeg(-1), createLeg(1));

  // ---- jagged back ridge
  for (let i = 0; i < 5; i++){
    boss.add(shard(spikeL, boneSpikeMat, 0, 2.0 + i*0.35, -0.75 - (i%2)*0.1, 1 - i*0.08, -2.1, 0, 0));
  }

  // ---- white chest collar shards
  for (let i = 0; i < 10; i++){
    const a = (i / 10) * Math.PI - Math.PI/2;
    boss.add(shard(spikeS, boneSpikeMat, Math.sin(a)*1.05, 3.15 + Math.cos(a)*0.3, 0.55, 0.9, Math.PI/2.6, 0, 0));
  }

  // ---- crimson ground aura
  const auraLight = new THREE.PointLight(0xff2200, 2.2, 8);
  auraLight.position.set(0, 2.2, 1.2);
  boss.add(auraLight);

  return boss;
}

function makeBoss(x, z){
  const g = createBossMonster();
  g.scale.setScalar(1.4);
  g.position.set(x, 0, z);
  scene.add(g);
  const flashMats = [];
  g.traverse(function(o){
    if (o.isMesh && o.material && o.material.emissive){
      flashMats.push({m:o.material, e:o.material.emissive.getHex()});
    }
  });
  const bossHp = 40 + wave * 4;
  const e = {
    mesh:g, isBoss:true, flashMats:flashMats, flashOn:false,
    hp:bossHp, maxHp:bossHp, speed:1.5 + wave * 0.03,
    range:3.0, damage:20,
    attackCd:0, flashT:0, dead:false, deadT:0, bob:Math.random()*10
  };
  g.traverse(function(o){ if (o.isMesh) o.userData.enemy = e; });
  enemies.push(e);
  document.getElementById('boss-wrap').style.display='block';
  updateBossBar(e);
  return e;
}
function updateBossBar(e){
  const bar = document.getElementById('boss-bar');
  if (bar) bar.style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
}

// ============================================================ game state
let running = false;
let hp = 100, kills = 0, wave = 0, betweenWaves = false, waveTimer = 0;
let yaw = 0, pitch = 0;
const EYE = 1.65;
const player = {x:0, z:0};

// input state
const keys = {};
let stickActive = false, stickId = -1, stickX = 0, stickY = 0;
let lookId = -1, lookLX = 0, lookLY = 0;
let shootHeld = false, shootCd = 0;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ============================================================ audio (tiny WebAudio blips)
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); return AC; }
function blip(freq, dur, type, vol, slide){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), ac.currentTime+dur);
  g.gain.setValueAtTime(vol||0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur);
}
function sfxShoot(){ blip(180, 0.09, 'square', 0.10, -120); blip(90, 0.12, 'sawtooth', 0.06, -50); }
function sfxHit(){ blip(500, 0.06, 'triangle', 0.09, 200); }
function sfxDead(){ blip(220, 0.25, 'sawtooth', 0.08, -180); }
function sfxHurt(){ blip(120, 0.2, 'sawtooth', 0.12, -60); }

// ============================================================ HUD
const hud = document.getElementById('hud');
const healthBar = document.getElementById('health-bar');
const healthNum = document.getElementById('health-num');
const waveChip = document.getElementById('wave-chip');
const killsChip = document.getElementById('kills-chip');
const vignette = document.getElementById('dmg-vignette');
const hitmarker = document.getElementById('hitmarker');
function updateHUD(){
  healthBar.style.width = Math.max(0,hp)+'%';
  healthNum.textContent = Math.max(0,Math.ceil(hp));
  healthBar.style.background = hp>50 ? 'linear-gradient(90deg,#4caf50,#8bc34a)'
    : hp>25 ? 'linear-gradient(90deg,#ff9800,#ffc107)' : 'linear-gradient(90deg,#f44336,#e91e63)';
  waveChip.textContent = 'WAVE '+Math.max(1,wave);
  killsChip.textContent = 'KILLS '+kills;
}
function showBanner(text){
  const b = document.getElementById('wave-banner');
  document.getElementById('wave-banner-text').textContent = text;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
function showHitmarker(){
  hitmarker.classList.remove('show'); void hitmarker.offsetWidth; hitmarker.classList.add('show');
}
let vigT = 0;
function damageFlash(){ vigT = 0.5; }

// ============================================================ waves
function startWave(n){
  wave = n; betweenWaves = false;
  if (n % 5 === 0){
    showBanner('\u26a0 BOSS WAVE \u26a0');
    const bp = randRing(32, 42);
    makeBoss(bp.x, bp.z);
    const count = 2 + Math.floor(n/2);
    for (let i=0;i<count;i++){
      const pos = randRing(30, 55);
      makeEnemy(pos.x, pos.z);
    }
  } else {
    showBanner('WAVE '+n);
    const count = 2 + n*2;
    for (let i=0;i<count;i++){
      const pos = randRing(30, 55);
      makeEnemy(pos.x, pos.z);
    }
  }
  updateHUD();
}

// ============================================================ shooting
const raycaster = new THREE.Raycaster();
const screenCenter = new THREE.Vector2(0,0);
function shoot(){
  if (shootCd > 0 || !running) return;
  shootCd = 0.28;
  flash.intensity = 2.2;
  gun.position.z = -0.48; // recoil
  sfxShoot();
  raycaster.setFromCamera(screenCenter, camera);
  raycaster.far = 120;
  const meshes = [];
  for (const e of enemies){ if(!e.dead) e.mesh.traverse(o=>{ if(o.isMesh) meshes.push(o); }); }
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length){
    const e = hits[0].object.userData.enemy;
    if (e && !e.dead){
      e.hp--; e.flashT = 0.12;
      if (e.isBoss) updateBossBar(e);
      showHitmarker(); sfxHit();
      if (e.hp<=0) killEnemy(e);
    }
  }
}

// ============================================================ input — touch
const stickZone = document.getElementById('stick-zone');
const stickNub = document.getElementById('stick-nub');
const btnShoot = document.getElementById('btn-shoot');

function stickCenter(){
  const r = stickZone.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, max:r.width/2};
}
window.addEventListener('touchstart', function(ev){
  if(!running) return;
  for (const t of ev.changedTouches){
    const inStick = t.clientX < window.innerWidth*0.45 && t.clientY > window.innerHeight*0.4;
    if (inStick && stickId===-1){ stickId = t.identifier; stickActive = true; moveStick(t); }
    else if (lookId===-1 && t.target!==btnShoot && !btnShoot.contains(t.target)){
      lookId = t.identifier; lookLX = t.clientX; lookLY = t.clientY;
    }
  }
  ev.preventDefault();
}, {passive:false});
window.addEventListener('touchmove', function(ev){
  if(!running) return;
  for (const t of ev.changedTouches){
    if (t.identifier===stickId) moveStick(t);
    else if (t.identifier===lookId){
      yaw   -= (t.clientX-lookLX)*0.0042;
      pitch -= (t.clientY-lookLY)*0.0042;
      pitch = Math.max(-1.35, Math.min(1.35, pitch));
      lookLX = t.clientX; lookLY = t.clientY;
    }
  }
  ev.preventDefault();
}, {passive:false});
window.addEventListener('touchend', function(ev){
  for (const t of ev.changedTouches){
    if (t.identifier===stickId){ stickId=-1; stickActive=false; stickX=0; stickY=0;
      stickNub.style.transform='translate(-50%,-50%)'; }
    if (t.identifier===lookId) lookId=-1;
  }
}, {passive:false});
function moveStick(t){
  const c = stickCenter();
  let dx = t.clientX-c.x, dy = t.clientY-c.y;
  const len = Math.hypot(dx,dy);
  if (len > c.max){ dx = dx/len*c.max; dy = dy/len*c.max; }
  stickX = dx/c.max; stickY = dy/c.max;
  stickNub.style.transform = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
}
btnShoot.addEventListener('touchstart', function(ev){ shootHeld = true; shoot(); ev.preventDefault(); ev.stopPropagation(); }, {passive:false});
btnShoot.addEventListener('touchend', function(ev){ shootHeld = false; ev.preventDefault(); }, {passive:false});

// ============================================================ input — desktop
document.addEventListener('keydown', e=>{ keys[e.code]=true; });
document.addEventListener('keyup',   e=>{ keys[e.code]=false; });
canvas.addEventListener('click', function(){
  if (running && !isTouch && document.pointerLockElement!==canvas) canvas.requestPointerLock();
});
document.addEventListener('mousemove', function(e){
  if (document.pointerLockElement===canvas && running){
    yaw   -= e.movementX*0.0023;
    pitch -= e.movementY*0.0023;
    pitch = Math.max(-1.35, Math.min(1.35, pitch));
  }
});
document.addEventListener('mousedown', function(){
  if (document.pointerLockElement===canvas){ shootHeld = true; shoot(); }
});
document.addEventListener('mouseup', function(){ shootHeld = false; });

// ============================================================ collision helper
function collide(nx, nz){
  const d = Math.hypot(nx, nz);
  if (d > WORLD_R) return true;
  for (const o of obstacles){
    if (Math.hypot(nx-o.x, nz-o.z) < o.r) return true;
  }
  return false;
}

// ============================================================ game flow
function startGame(){
  audio();
  document.getElementById('start-screen').style.display='none';
  document.getElementById('gameover-screen').style.display='none';
  hud.style.display='block';
  // reset
  for (const e of enemies) scene.remove(e.mesh);
  enemies.length = 0;
  document.getElementById('boss-wrap').style.display='none';
  hp = 100; kills = 0; wave = 0; yaw = 0; pitch = 0;
  player.x = 0; player.z = 0;
  running = true; betweenWaves = true; waveTimer = 1.2;
  updateHUD();
  showBanner('GET READY!');
}
function gameOver(){
  running = false;
  document.getElementById('final-score').textContent =
    'Kills: '+kills+'  \u2022  Wave '+Math.max(1,wave);
  document.getElementById('gameover-screen').style.display='flex';
  hud.style.display='none';
  if (document.pointerLockElement) document.exitPointerLock();
}
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

// ============================================================ main loop
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (running){
    // ---- movement
    let mx = 0, mz = 0;
    if (keys['KeyW']||keys['ArrowUp']) mz += 1;
    if (keys['KeyS']||keys['ArrowDown']) mz -= 1;
    if (keys['KeyA']||keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD']||keys['ArrowRight']) mx += 1;
    mx += stickX; mz -= stickY;
    const mlen = Math.hypot(mx,mz);
    if (mlen > 1){ mx/=mlen; mz/=mlen; }
    const speed = 6.2;
    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    const dx = (mx*cos - mz*sin)*speed*dt;
    const dz = (-mx*sin - mz*cos)*speed*dt;
    if (!collide(player.x+dx, player.z)) player.x += dx;
    if (!collide(player.x, player.z+dz)) player.z += dz;

    const bobbing = (mlen>0.1) ? Math.sin(time*11)*0.05 : 0;
    camera.position.set(player.x, EYE+bobbing, player.z);
    camera.rotation.set(0,0,0);
    camera.rotateY(yaw); camera.rotateX(pitch);

    // gun recoil recover
    gun.position.z += (-0.55 - gun.position.z)*10*dt;
    flash.intensity = Math.max(0, flash.intensity - 18*dt);
    shootCd = Math.max(0, shootCd - dt);
    if (shootHeld) shoot();

    // ---- enemies
    let alive = 0;
    for (let i=enemies.length-1; i>=0; i--){
      const e = enemies[i];
      if (e.dead){
        e.deadT += dt;
        e.mesh.rotation.x = Math.min(Math.PI/2, e.deadT*4);
        e.mesh.position.y = -e.deadT*0.6;
        if (e.deadT > 1.1){ scene.remove(e.mesh); enemies.splice(i,1); }
        continue;
      }
      alive++;
      const ex = e.mesh.position.x, ez = e.mesh.position.z;
      const toX = player.x-ex, toZ = player.z-ez;
      const dist = Math.hypot(toX, toZ);
      e.mesh.rotation.y = Math.atan2(toX, toZ);
      // walk bob
      e.bob += dt*8;
      e.mesh.position.y = Math.abs(Math.sin(e.bob))*0.08;

      if (dist > (e.range || 2.0)){
        const step = e.speed*dt;
        const nx = ex + toX/dist*step, nz = ez + toZ/dist*step;
        // enemies walk around obstacles crudely: slide along if blocked
        if (!collide(nx, nz)){ e.mesh.position.x = nx; e.mesh.position.z = nz; }
        else if (!collide(nx, ez)) e.mesh.position.x = nx;
        else if (!collide(ex, nz)) e.mesh.position.z = nz;
      } else {
        e.attackCd -= dt;
        if (e.attackCd <= 0){
          e.attackCd = e.isBoss ? 1.4 : 1.0;
          hp -= (e.damage || 8); damageFlash(); sfxHurt(); updateHUD();
          if (hp <= 0){ gameOver(); }
        }
      }
      // hit flash
      if (e.flashT > 0){
        e.flashT -= dt;
        if (e.flashMats){
          if (!e.flashOn){ e.flashOn = true; for (const f of e.flashMats) f.m.emissive.setHex(0x888888); }
        } else {
          e.bodyMat.color.setHex(0xffffff);
          e.headMat.color.setHex(0xffffff);
        }
        if (e.flashT <= 0){
          if (e.flashMats){
            e.flashOn = false; for (const f of e.flashMats) f.m.emissive.setHex(f.e);
          } else {
            e.bodyMat.color.setHex(0x8a2f2f);
            e.headMat.color.setHex(0xd9b08c);
          }
        }
      }
    }

    // ---- wave flow
    if (!betweenWaves && alive === 0 && enemies.length === 0){
      betweenWaves = true; waveTimer = 3;
      showBanner('WAVE CLEARED!');
      hp = Math.min(100, hp+25); updateHUD();
    }
    if (betweenWaves){
      waveTimer -= dt;
      if (waveTimer <= 0) startWave(wave+1);
    }

    // ---- vignette decay
    if (vigT > 0){ vigT -= dt; vignette.style.opacity = Math.max(0, vigT*1.6); }
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// test hooks
window.__game = {
  start: startGame,
  state: function(){ return {running:running, hp:hp, kills:kills, wave:wave,
    enemies:enemies.length, px:player.x, pz:player.z}; },
  setYaw: function(y){ yaw = y; },
  setPitch: function(p){ pitch = p; },
  shoot: shoot,
  move: function(x,z){ player.x=x; player.z=z; },
  enemies: function(){ return enemies.map(function(e){ return {x:e.mesh.position.x, z:e.mesh.position.z, hp:e.hp, dead:e.dead, boss:!!e.isBoss}; }); },
  spawnBoss: function(){ const p = randRing(12, 16); return makeBoss(p.x, p.z); }
};
})();
</script>
